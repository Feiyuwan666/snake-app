name: 构建 APK

on: [push, workflow_dispatch]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 安装 Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: 安装依赖
        run: npm install

      - name: 生成安卓工程并同步网页代码
        run: |
          npx cap telemetry off
          npx cap add android
          npx cap sync android

      - name: 编译 APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: 上传 APK（构建产物）
        uses: actions/upload-artifact@v4
        with:
          name: snake-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: 发布到 Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view apk-latest >/dev/null 2>&1 || gh release create apk-latest --title "贪吃蛇 APK（最新版）" --notes "由 GitHub Actions 自动构建，点击下面的 app-debug.apk 下载安装。"
          gh release upload apk-latest android/app/build/outputs/apk/debug/app-debug.apk --clobber
