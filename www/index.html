<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>贪吃蛇</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #111; overflow: hidden;
    touch-action: none; -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent; }
  #wrap { height: 100%; display: flex; flex-direction: column; align-items: center;
    justify-content: center; font-family: sans-serif; color: #eee;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    box-sizing: border-box; }
  #score { margin-bottom: 10px; font-size: 18px; color: #9f9; }
  canvas { background: #000; border-radius: 10px; box-shadow: 0 0 24px rgba(90,255,130,.15); display: block; }
  #tip { margin-top: 12px; font-size: 13px; color: #777; }
  #autoBtn { position: absolute; top: 10px; right: 10px; z-index: 5;
    padding: 6px 12px; font-size: 13px; font-family: sans-serif; color: #9f9;
    background: rgba(20,20,20,.85); border: 1px solid rgba(90,255,130,.45);
    border-radius: 16px; cursor: pointer; }
  #autoBtn.on { color: #111; background: #9f9; }
</style>
</head>
<body>
<div id="wrap">
  <div id="score">得分: 0 · 最高: 0</div>
  <canvas id="game"></canvas>
  <div id="tip">滑动屏幕控制方向</div>
</div>
<button id="autoBtn" type="button">自动演示</button>
<script>
(function () {
"use strict";

var canvas = document.getElementById('game');
var ctx = canvas.getContext('2d');
var scoreEl = document.getElementById('score');

var GRID = 20;          // 20 x 20 个格子
var CELL = 16;          // 每个格子的像素大小（自动按屏幕计算）
var BASE_TICK = 150;    // 初始速度：每步毫秒数，数字越小蛇跑得越快
var MIN_TICK = 70;      // 最快到这里
var TICK = BASE_TICK;

var snake, dir, nextDir, food, score, best, timer = null;
var state = 'ready';    // ready 准备 / playing 进行中 / over 结束

try { best = parseInt(localStorage.getItem('snake_best') || '0', 10) || 0; } catch (e) { best = 0; }

/* ---------- 尺寸自适应 ---------- */
function applySize() {
  var vw = document.documentElement.clientWidth || window.innerWidth;
  var vh = document.documentElement.clientHeight || window.innerHeight;
  var size = Math.min(vw - 24, vh - 150);
  CELL = Math.max(10, Math.floor(size / GRID));
  canvas.width = CELL * GRID;
  canvas.height = CELL * GRID;
}

/* ---------- 重新开始一局 ---------- */
function reset() {
  snake = [{ x: 6, y: 10 }, { x: 5, y: 10 }, { x: 4, y: 10 }];
  dir = { x: 1, y: 0 };
  nextDir = { x: 1, y: 0 };
  score = 0;
  TICK = BASE_TICK;
  state = 'ready';
  if (timer) { clearInterval(timer); timer = null; }
  placeFood();
  updateHud();
  draw();
}

function updateHud() {
  scoreEl.textContent = '得分: ' + score + ' · 最高: ' + best;
}

/* ---------- 随机放食物 ---------- */
function placeFood() {
  var free = [];
  for (var x = 0; x < GRID; x++) {
    for (var y = 0; y < GRID; y++) {
      var taken = false;
      for (var i = 0; i < snake.length; i++) {
        if (snake[i].x === x && snake[i].y === y) { taken = true; break; }
      }
      if (!taken) { free.push({ x: x, y: y }); }
    }
  }
  if (free.length === 0) { food = { x: -1, y: -1 }; return; }
  food = free[Math.floor(Math.random() * free.length)];
}

/* ---------- 主循环 ---------- */
function tick() {
  dir = nextDir;
  var head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

  // 撞墙
  if (head.x < 0 || head.x >= GRID || head.y < 0 || head.y >= GRID) { return gameOver(); }

  // 撞自己（尾巴马上会挪走，不算）
  for (var i = 0; i < snake.length - 1; i++) {
    if (snake[i].x === head.x && snake[i].y === head.y) { return gameOver(); }
  }

  var eat = (head.x === food.x && head.y === food.y);
  snake.unshift(head);
  if (eat) {
    score++;
    if (score > best) {
      best = score;
      try { localStorage.setItem('snake_best', String(best)); } catch (e) {}
    }
    updateHud();
    placeFood();
    // 每吃 5 个加速一档
    if (score % 5 === 0 && TICK > MIN_TICK) {
      TICK = Math.max(MIN_TICK, TICK - 10);
      if (timer) { clearInterval(timer); }
      timer = setInterval(tick, TICK);
    }
  } else {
    snake.pop();
  }
  draw();
}

function gameOver() {
  state = 'over';
  if (timer) { clearInterval(timer); timer = null; }
  draw();
}

/* ---------- 方向控制 ---------- */
function setDir(dx, dy) {
  if (state === 'over') { return; }
  if (dx === -dir.x && dy === -dir.y) { return; }         // 不能直接掉头
  if (dx === -nextDir.x && dy === -nextDir.y) { return; } // 防止一帧内连转两次撞到自己
  nextDir = { x: dx, y: dy };
  if (state === 'ready') {
    state = 'playing';
    if (!timer) { timer = setInterval(tick, TICK); }
  }
}

/* ---------- 画图 ---------- */
function draw() {
  var w = canvas.width;
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, w, w);

  // 食物
  ctx.fillStyle = '#e53935';
  ctx.fillRect(food.x * CELL + 2, food.y * CELL + 2, CELL - 4, CELL - 4);

  // 蛇
  for (var i = 0; i < snake.length; i++) {
    ctx.fillStyle = (i === 0) ? '#7CFC00' : '#3CB371';
    ctx.fillRect(snake[i].x * CELL + 2, snake[i].y * CELL + 2, CELL - 4, CELL - 4);
  }

  if (state === 'ready') {
    overlay('滑动屏幕开始游戏');
  } else if (state === 'over') {
    overlay('游戏结束\n得分 ' + score + '\n点击屏幕重新开始');
  }
}

function overlay(text) {
  var w = canvas.width;
  ctx.fillStyle = 'rgba(0,0,0,0.6)';
  ctx.fillRect(0, 0, w, w);
  ctx.fillStyle = '#fff';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.font = Math.floor(w / 18) + 'px sans-serif';
  var lines = text.split('\n');
  var lh = Math.floor(w / 13);
  var y0 = w / 2 - (lines.length - 1) * lh / 2;
  for (var i = 0; i < lines.length; i++) {
    ctx.fillText(lines[i], w / 2, y0 + i * lh);
  }
}

/* ---------- 键盘（电脑上测试用） ---------- */
document.addEventListener('keydown', function (e) {
  var k = e.key;
  var dx = 0, dy = 0;
  if (k === 'ArrowUp' || k === 'w' || k === 'W') { dy = -1; }
  else if (k === 'ArrowDown' || k === 's' || k === 'S') { dy = 1; }
  else if (k === 'ArrowLeft' || k === 'a' || k === 'A') { dx = -1; }
  else if (k === 'ArrowRight' || k === 'd' || k === 'D') { dx = 1; }
  else if (k === ' ' || k === 'Enter') {
    if (state === 'over') { reset(); }
    e.preventDefault();
    return;
  } else { return; }
  e.preventDefault();
  if (state === 'over') { reset(); }
  setDir(dx, dy);
});

/* ---------- 触屏（手机上玩） ---------- */
var sx = 0, sy = 0, touching = false;
document.addEventListener('touchstart', function (e) {
  if (state === 'over') { reset(); }
  var t = e.changedTouches[0];
  sx = t.clientX; sy = t.clientY;
  touching = true;
}, { passive: true });

document.addEventListener('touchend', function (e) {
  if (!touching) { return; }
  touching = false;
  var t = e.changedTouches[0];
  var dx = t.clientX - sx, dy = t.clientY - sy;
  var ax = Math.abs(dx), ay = Math.abs(dy);
  if (ax < 24 && ay < 24) { return; }   // 只是点了一下，不算滑动
  if (ax > ay) { setDir(dx > 0 ? 1 : -1, 0); }
  else { setDir(0, dy > 0 ? 1 : -1); }
}, { passive: true });

document.addEventListener('touchmove', function (e) { e.preventDefault(); }, { passive: false });
document.addEventListener('contextmenu', function (e) { e.preventDefault(); });
document.addEventListener('mousedown', function () { if (state === 'over') { reset(); } });
window.addEventListener('resize', function () { applySize(); draw(); });
document.addEventListener('visibilitychange', function () {
  if (document.hidden && timer) { clearInterval(timer); timer = null; }
  else if (!document.hidden && state === 'playing' && !timer) { timer = setInterval(tick, TICK); }
});

/* ---------- 自动演示（寻路 AI，独立模块，不影响上面的玩法） ---------- */
var autoOn = false;
var autoBtn = document.getElementById('autoBtn');

var keyOf = function (p) { return p.x + ',' + p.y; };

// 用 BFS 找从蛇头到食物的最短路径；注意蛇尾这一格下一步会空出来，可以踩
function autoStep() {
  if (!snake || !food || snake.length === 0) { return null; }
  var head = snake[0];
  var blocked = {};
  for (var i = 0; i < snake.length - 1; i++) { blocked[keyOf(snake[i])] = true; }

  var prev = {};
  prev[keyOf(head)] = null;
  var queue = [head];
  var reached = false;
  while (queue.length > 0) {
    var cur = queue.shift();
    if (cur.x === food.x && cur.y === food.y) { reached = true; break; }
    var DIRS = [[1, 0], [-1, 0], [0, 1], [0, -1]];
    for (var d = 0; d < DIRS.length; d++) {
      var nx = cur.x + DIRS[d][0], ny = cur.y + DIRS[d][1];
      if (nx < 0 || ny < 0 || nx >= GRID || ny >= GRID) { continue; }
      var k = nx + ',' + ny;
      if (blocked[k] || prev[k] !== undefined) { continue; }
      prev[k] = { p: cur, dx: DIRS[d][0], dy: DIRS[d][1] };
      queue.push({ x: nx, y: ny });
    }
  }

  if (reached) {
    // 从食物回溯到蛇头的第一步
    var node = food, step = null;
    while (true) {
      var pr = prev[keyOf(node)];
      if (!pr) { break; }
      step = { dx: pr.dx, dy: pr.dy };
      node = pr.p;
      if (node.x === head.x && node.y === head.y) { break; }
    }
    return step;
  }

  // 没有通往食物的路：挑一个离墙最远的相邻空位，争取活久一点
  var best = null, bestRoom = -1;
  var DIRS2 = [[1, 0], [-1, 0], [0, 1], [0, -1]];
  for (var j = 0; j < DIRS2.length; j++) {
    var ax = head.x + DIRS2[j][0], ay = head.y + DIRS2[j][1];
    if (ax < 0 || ay < 0 || ax >= GRID || ay >= GRID) { continue; }
    if (blocked[ax + ',' + ay]) { continue; }
    var room = Math.min(ax, ay, GRID - 1 - ax, GRID - 1 - ay);
    if (room > bestRoom) { bestRoom = room; best = { dx: DIRS2[j][0], dy: DIRS2[j][1] }; }
  }
  return best;
}

// 演示时每隔一拍由 AI 替玩家决定方向（走的是原版 setDir，规则完全一致）
var autoTimer = setInterval(function () {
  if (!autoOn || state !== 'playing') { return; }
  var step = autoStep();
  if (step) { setDir(step.dx, step.dy); }
}, 20);

function setAuto(on) {
  autoOn = on;
  autoBtn.className = on ? 'on' : '';
  autoBtn.textContent = on ? '退出演示' : '自动演示';
  if (on) {
    if (state === 'over') { reset(); }
    if (state === 'ready') { setDir(Math.abs(dir.x) === 1 ? 0 : 1, Math.abs(dir.x) === 1 ? 1 : 0); }
  }
}

autoBtn.addEventListener('click', function (e) {
  e.stopPropagation();
  setAuto(!autoOn);
});

// 演示模式下蛇死了，停一拍自动重开，像屏保一样循环
var autoOverAt = 0;
setInterval(function () {
  if (!autoOn) { autoOverAt = 0; return; }
  if (state !== 'over') { autoOverAt = 0; return; }
  if (autoOverAt === 0) { autoOverAt = Date.now(); return; }
  if (Date.now() - autoOverAt < 1200) { return; }
  reset();
  setAuto(true);
}, 250);

/* ---------- 启动 ---------- */
applySize();
reset();
})();
</script>
</body>
</html>
